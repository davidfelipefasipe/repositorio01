<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página Moderna</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <h2>Logo</h2>
            <ul>

                <li><a href="#">Contato</a></li>
            </ul>

    <main>

                <h3>Card 3</h3>
                <p>Dark mode incluído!</p>
            </div>

    <footer>
        <p>Feito com ❤️ por Grok • 2026</p>
